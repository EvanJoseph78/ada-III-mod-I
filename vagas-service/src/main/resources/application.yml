server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: vagas-service
  datasource:
    url: ${VAGAS_DB_URL:jdbc:postgresql://localhost:5432/vagas}
    username: ${VAGAS_DB_USER:vagas_svc}
    password: ${VAGAS_DB_PASSWORD:vagas-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true