server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: vagas-service
  datasource:
    url: ${VAGAS_DB_URL:jdbc:postgresql://localhost:5432/vagas}
    username: ${VAGAS_DB_USER:vagas_svc}
    password: ${VAGAS_DB_PASSWORD:vagas-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 3000
        max.block.ms: 5000
integracoes:
  candidaturas-url: ${CANDIDATURAS_SERVICE_URL:http://localhost:8083}
  timeout-ms: ${INTEGRACOES_TIMEOUT_MS:2000}
mensageria:
  enabled: ${MENSAGERIA_ENABLED:true}
  outbox:
    intervalo-ms: ${OUTBOX_INTERVALO_MS:1000}
